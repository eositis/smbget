# SMBGET: stock apple2enh-system.cfg, with these changes:
#  - the AppleSingle header is not written (HEADER has no file);
#  - the NIC overlay (SMBGET.UTH or SMBGET.COG) loads at $0800, below the SYS image;
#  - the ProDOS I/O buffer sits at $B800.
# The C stack is $BD00-$BEFF (crt0 sets sp to $BF00).

SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $00FF; # ProDOS file type
    __STACKSIZE__: type = weak, value = $0200;
    __LCADDR__:    type = weak, value = $D400; # Behind quit code
    __LCSIZE__:    type = weak, value = $0C00; # Rest of bank two
	__NICSIZE__:   type = weak, value = $1800;
    _nic_hole:     type = export, value = $0800;
}
MEMORY {
    HEADER: file = "",               start = $2000 - $003A, size = $003A;   # AppleSingle header: linked but not written
    ZP:     file = "", define = yes, start = $0080,         size = $001A;
    NIC:    file = "", define = yes, start = $0800,         size = $1800;
    MAIN:   file = %O, define = yes, start = $2000,         size = $BF00 - $2000;
    BSS:    file = "",               start = __ONCE_RUN__,  size = $B900 - __ONCE_RUN__;
    IO:     file = "",               start = $B900,         size = $0400;
    LC:     file = "", define = yes, start = __LCADDR__,    size = __LCSIZE__;
}
SEGMENTS {
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    ZEROPAGE: load = ZP,             type = zp;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
    NICHOLE:  load = NIC,            type = bss, optional = yes;
    IOBUF:    load = IO,             type = bss;            # ProDOS file buffer, page aligned at $B900
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
