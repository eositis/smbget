# SMBGET.OVL: loaded at $0800 (free RAM below the program at $2000); BSS in $1C00-$1FFF.
MEMORY {
    OVL:  file = %O, start = $0800, size = $1400;
    OVLB: file = "", start = $1C00, size = $0400;
}
SEGMENTS {
    OVLSTART: load = OVL,  type = ro;
    CODE:     load = OVL,  type = ro;
    RODATA:   load = OVL,  type = ro;
    DATA:     load = OVL,  type = rw;
    BSS:      load = OVLB, type = bss, define = yes;
}
